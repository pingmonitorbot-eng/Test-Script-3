name: TempNumbers worker

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = test only, nothing is sent to the bot"
        default: "0"
  schedule:
    - cron: "17 */5 * * *"      # safety net: if no run is active, this starts one

permissions:
  contents: read
  actions: write                 # lets a run start the next run

# Only ONE run is active at a time. A run started during another run waits in the queue
# and begins the moment the active one ends → a clean 5-hour hand-over.
concurrency:
  group: tempnumbers-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 345         # GitHub's hard limit is 6 hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run worker
        env:
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          BOT_URL: ${{ secrets.BOT_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          NEXT_RUN_TOKEN: ${{ secrets.NEXT_RUN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python worker.py
