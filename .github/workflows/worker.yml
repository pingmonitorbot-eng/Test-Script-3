name: TempNumbers worker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */5 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: tempnumbers-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run worker
        env:
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          # If secret empty, worker falls back to tech_og_bot
          MONGO_DB: ${{ secrets.MONGO_DB }}
          INBOX_COL: tempnumbers_inbox
          NEXT_RUN_TOKEN: ${{ secrets.NEXT_RUN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_SECONDS: "18000"
          POLL_SECONDS: "15"
          HANDOVER_SECONDS: "300"
        run: python worker.py
