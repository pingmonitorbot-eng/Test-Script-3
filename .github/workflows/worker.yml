name: TempNumbers worker

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = test only, nothing is sent to the bot"
        default: "1"
  schedule:
    - cron: "17 */5 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: tempnumbers-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run worker
        env:
          # Panel login (also hardcoded as defaults in worker.py)
          PANEL_USER: test_panel
          PANEL_PASS: test_panel
          PANEL_BASE: https://tempnumbers.net
          # Optional live bot — leave empty for DRY-RUN
          BOT_URL: ${{ secrets.BOT_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          NEXT_RUN_TOKEN: ${{ secrets.NEXT_RUN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || '1' }}
          # Shorter first test (override in code or set RUN_SECONDS secret later)
          RUN_SECONDS: "600"
          POLL_SECONDS: "5"
          WINDOW_MINUTES: "20"
        run: python worker.py
