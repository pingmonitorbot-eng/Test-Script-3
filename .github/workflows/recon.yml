name: Recon gen-stats

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.49.1
          playwright install --with-deps chromium

      - name: Run recon
        env:
          PANEL_USER: test_panel
          PANEL_PASS: test_panel
          LOGIN_URL: https://tempnumbers.net/login
          TARGET_URL: https://tempnumbers.net/gen-stats
        run: python recon_gen_stats.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: ignore
